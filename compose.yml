services:

  # ── FastAPI app ───────────────────────────────────────────────────────────────
  api:
    image: praveshyadav71/chatbot:latest
    build:
      context: .
      dockerfile: dockerfile          
      target: runtime
    container_name: chatbot_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/chatbot
      DATABASE_URL1: postgresql://postgres:postgres@db:5432/chatbot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - chatbot_net

  # ── Celery worker different command 
  celery:
    image: praveshyadav71/chatbot:latest   
    container_name: chatbot_celery
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "worker",
              "--loglevel=info",
              "--concurrency=2",
              "--pool=prefork",
              "-Q", "default"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/chatbot
      DATABASE_URL1: postgresql://postgres:postgres@db:5432/chatbot
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - chatbot_net

 
  

  # ── Redis 
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - chatbot_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Postgres database for local development
  db:
    image: postgres:16-alpine
    container_name: chatbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flower — Celery monitor (dev only) ────────────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: chatbot_flower
    restart: unless-stopped
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chatbot_net
    profiles:
      - dev

volumes:
  redis_data:
  uploads_data:
  chroma_data:
  postgres_data:

networks:
  chatbot_net:
    driver: bridge